services:
  postgres:
    image: postgres:16
    container_name: dn-global-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnglobal
      POSTGRES_USER: dnglobal
      POSTGRES_PASSWORD: dnglobal_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
